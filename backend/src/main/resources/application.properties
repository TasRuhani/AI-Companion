spring.application.name=companion
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/companion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

companion.portrait.storage-dir=${COMPANION_PORTRAIT_STORAGE_DIR:./data/companion-portraits}
companion.portrait.max-file-size=${COMPANION_PORTRAIT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=${COMPANION_PORTRAIT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${COMPANION_PORTRAIT_MAX_REQUEST_SIZE:6MB}

companion.web-search.enabled=${WEB_SEARCH_ENABLED:false}
companion.web-search.api-key=${TAVILY_API_KEY:}
companion.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}